    - main [ref=f4e113]:
      - generic [ref=f4e115]:
        - heading "Chennai Midnight Marathon" [level=2] [ref=f4e121]
        - generic [ref=f4e124]:
          - heading "The Origin" [level=2] [ref=f4e125]
          - generic [ref=f4e127]:
            - text: The name ‘marathon’ comes from the legend of Pheidippides, a Greek soldier, who was sent from the town of Marathon to Athens to announce that the Persians had been defeated in the Battle of Marathon. It is said that he ran the entire distance without stopping and burst into the Senate, exclaiming “Nenikékamen”, ‘We have won’ or ‘We are victorious’ before collapsing and dying of exhaustion.
            - heading "Motivation" [level=4] [ref=f4e128]
            - text: We are different, in essence, from other men. If you want to win something, run 100 meters. If you want to experience something, run a marathon – Emil Zatopek, Olympic Legend.
        - generic "Tabs. Open items with Enter or Space, close with Escape and navigate using the Arrow keys." [ref=f4e135]:
          - tablist [ref=f4e136]:
            - tab "THE ORGANISERS" [selected] [ref=f4e137]
            - tab "THE CAUSE" [ref=f4e138]
            - tab "THE ESSENCE" [ref=f4e139]
            - tab "THE OPPORTUNITY" [ref=f4e140]
          - generic [ref=f4e141]:
            - tabpanel "THE ORGANISERS" [ref=f4e142]:
              - paragraph [ref=f4e147]: The humble efforts of a group of 25 like-minded people from RBITC culminated in the first edition of the Chennai Midnight Marathon on 19th May 2007, jointly organized with Crossover Sports Ltd., a leading sports and entertainment company. First of its kind in Asia, the event attracted more than 4,000 participants and was widely reported in India and the world over. Rotary Chennai IT Corridor (RBITC) was formed in June 2006 and has in the last many years funded and implemented several Community Projects in the area of primary health care, rural livelihood provision through vocational training programs, primary education by adopting government schools and supporting mid-day meal program and scores of other charitable, community service and environmental initiatives.
            - tabpanel "THE CAUSE" [ref=f4e148]:
              - generic [ref=f4e152]:
                - paragraph [ref=f4e153]: "Professional athletes and enthusiastic runners alike join together to run for a specific cause each year, which forms the theme of the marathon. Such themes of previous editions include: ‘Run for a Child’ (2011) and ‘It’s fashionable to be Green ’ (2009 & 2010), which raised hundreds of thousands of rupees for the city. This year we ‘Run for Safe City’. This theme assumes special significance after the unprecedented incidents that have taken place, be it women safety or road rage or infrastructure or even building and Metro girders accidents."
                - paragraph [ref=f4e154]: Lets break free. Lets Run Free again.
            - tabpanel "THE ESSENCE" [ref=f4e155]:
              - generic [ref=f4e159]:
                - paragraph [ref=f4e160]: The Chennai Midnight Marathon represents the vision, vigor and vibrance of the beloved and inspiring city. At its heart, the initiative aimed to create a platform to raise funds for health, education, social welfare and rural enlistment projects. And in its successive years, the marathon has remained true to its simple purpose. Since inception, hundreds of people have raised money, generating funds that have provided free spinal and eye surgeries for the needy, scholarships for deserving youth, vocational training sponsorships, mid-day meals in schools, among many others.
                - paragraph [ref=f4e161]: 16 editions of the Chennai Midnight Marathon have been held till date, with unprecedented success and support from local, national and international athletes. The race is more than just an athletic event; it is a glimpse into the cultural diversity of the state of Karnataka. In previous years, race day functions have included cultural performances of traditional Indian art forms, dancers, percussion artists as well as more western rock shows, giving a unique blend of a modern and ethnic flavor to the activities. The Pet-a-thon allows attendants to participate with their pets, giving a fun twist to the day’s events.
            - tabpanel "THE OPPORTUNITY" [ref=f4e162]:
              - generic [ref=f4e166]:
                - paragraph [ref=f4e167]: The CMM reflects a unique spectrum of values which is shared by participants, their families and supporters across India and the world. Associations established with the marathon display not just a heart for social responsibility but also provide a platform for display and contact. Our partners share our values and also appreciate the opportunity of a wide reach and the overall brand leverage.
                - paragraph [ref=f4e168]: All of Chennai comes out on race day to celebrate the spirit of the city. Companies participate in large numbers using the marathon as a platform to show support for the city, for employee engagement & brand visibility
                - paragraph [ref=f4e169]: 100’s of NGOs participate to raise funds for and also to create awareness on their cause. The Sports & Film fraternity & celebrities participate to show their support for the city and also help select NGOs in raising funds.
