    - generic [ref=e185]:
      - heading "The CMM Story" [level=2] [ref=e188]
      - heading "The Chennai Midnight Marathon represents the vision, vigour and vibrance of the beloved and inspiring city. The Chennai Midnight Marathon (CMM) was founded by Rotary Chennai IT Corridor in 2007 to support various deserving charities across India. With its unique chosen hours, it is Asia’s only Midnight Marathon. The concept has captivated people resulting in a growing number of participants, from over 20 countries, and 23 States in India, each year." [level=2] [ref=e192]:
