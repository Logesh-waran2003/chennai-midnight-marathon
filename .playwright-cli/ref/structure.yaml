    - generic [ref=e254]:
      - heading "The BMM Story" [level=2] [ref=e257]
      - heading "The Bengaluru Midnight Marathon represents the vision, vigour and vibrance of the beloved and inspiring city. The Bengaluru Midnight Marathon (BMM) was founded by Rotary Bangalore IT Corridor in 2007 to support various deserving charities across India. With its unique chosen hours, it is Asia’s only Midnight Marathon. The concept has captivated people resulting in a growing number of participants, from over 20 countries, and 23 States in India, each year." [level=2] [ref=e261]:
